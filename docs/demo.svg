<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-label="Terminal replay of pcap-triage on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}</style><rect width="860" height="440" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">pcap-triage</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./pcap-triage examples/sample.pcap</text><text class="r d0 " x="20" y="108" xml:space="preserve">pcap-triage: 145 packets, 85 flows, 80204 bytes, 7.3s</text><text class="r d1 " x="20" y="130" xml:space="preserve">tcp 133, udp 12, dns queries 12</text><text class="r d2 " x="20" y="152" xml:space="preserve">SCANNERS (2)</text><text class="r d3 " x="20" y="174" xml:space="preserve">  203.0.113.9     port scan: 40 distinct targets on 1 hosts, 40 SYNs</text><text class="r d4 " x="20" y="196" xml:space="preserve">  198.51.100.77   host sweep: 30 distinct targets on 30 hosts, 30 SYNs</text><text class="r d5 " x="20" y="218" xml:space="preserve">CLEARTEXT CREDENTIALS (2), passwords are never printed</text><text class="r d6 " x="20" y="240" xml:space="preserve">  ftp   10.0.0.20 -&gt; 10.0.0.5:21  user=backup-svc  password=11 chars</text><text class="r d7 " x="20" y="262" xml:space="preserve">  http  10.0.0.21 -&gt; 10.0.0.8:8080  user=alice  password=12 chars</text><text class="r d8 " x="20" y="284" xml:space="preserve">TOP FLOWS BY BYTES</text><text class="r d9 " x="20" y="306" xml:space="preserve">  10.0.0.30:50003 -&gt; 192.0.2.50:443  tcp  75240 bytes, 60 packets</text><text class="r d10 " x="20" y="328" xml:space="preserve">  10.0.0.20:50001 -&gt; 10.0.0.5:21  tcp  143 bytes, 2 packets</text><text class="r d11 " x="20" y="350" xml:space="preserve">  10.0.0.21:50002 -&gt; 10.0.0.8:8080  tcp  141 bytes, 1 packets</text><text class="r d12 " x="20" y="372" xml:space="preserve">  10.0.0.30:53001 -&gt; 10.0.0.1:53  udp  75 bytes, 1 packets</text><text class="r d13 " x="20" y="394" xml:space="preserve">  10.0.0.30:53004 -&gt; 10.0.0.1:53  udp  75 bytes, 1 packets</text></svg>
